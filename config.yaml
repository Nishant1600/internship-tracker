schedule:
  time: "08:00"
  timezone: "Asia/Kolkata"

link_check:
  # probes every company URL daily before the pipeline run and Telegram-alerts
  # only links whose state changed since the previous check
  enabled: true
  time: "07:30"

database:
  path: "./data/jobs.db"

logging:
  level: "INFO"
  file: "./logs/tracker.log"

scraper:
  timeout_seconds: 30
  retry_count: 3
  retry_backoff_seconds: 5
  headless: true

filters:
  role_keywords:
    include:
      - "intern"
      - "internship"
      - "summer intern"
      - "winter intern"
      - "research intern"
      - "co-op"
      - "fellowship"
    # 'virtual' and 'challenge' removed: role_keywords.include also searches the
    # job description, where those words appear in ordinary prose ('challenging
    # work', 'virtual teams') and let full-time jobs through — 7 of 17 matches.
    exclude:
      - "senior"
      - "lead"
      - "manager"
      - "director"
      - "staff"
      - "principal"
      - "full-time only"
      - "new grad"
      - "new graduate"
      - "phd"
      - "ph.d"
      - "doctoral"
  title_keywords:
    include:
      - "software engineer"
      - "SWE"
      - "software development"
      - "quantitative"
      - "quant"
      - "data science"
      - "machine learning"
      - "ML"
      - "research"
      - "risk analyst"
      - "backend"
      - "frontend"
      - "full stack"
      - "technology consulting"
      - "ai"
    exclude: []
  locations:
    include:
      - "India"
      - "IN"
      - "IND"
      - "Bangalore"
      - "Bengaluru"
      - "Hyderabad"
      - "Mumbai"
      - "Pune"
      - "Chennai"
      - "Gurgaon"
      - "Gurugram"
      - "Noida"
      - "Delhi"
      - "Kolkata"
      - "Ahmedabad"
      - "Jaipur"
      - "Chandigarh"
      - "Coimbatore"
      - "Indore"
      - "Kochi"
      - "Karnataka"
      - "Maharashtra"
      - "Telangana"
      - "Tamil Nadu"
      - "Haryana"
      - "Uttar Pradesh"
      - "Remote"
      - "Anywhere"
      - "Global"
      - "Hybrid"
      - "WFH"
      - "Work from home"
    exclude:
      - "us only"
      - "eu only"
      - "uk only"
      - "usa only"
      - "united states only"
  employment_types:
    # include left empty: real internships ship as 'full time'/'Full Time Employee',
    # so an include list rejected them (8/95 live internship postings). Role and
    # title keywords already gate the role; exclude still drops 'full-time' types.
    include: []
    exclude:
      - "full-time"
  allowed_grad_years:
    - 2027
    - 2028
    - 2029
    - null
  max_posting_age_days: 30

telegram:
  enabled: true
  max_jobs_per_digest: 25
  send_if_empty: false

features:
  dedup_notifications: true
  track_seen_only: false

aggregator_feeds:
  enabled: true
  max_posting_age_days: 3
  sources:
    # 2026-* feeds were byte-identical mirrors of the 2027 ones — dropped as duplicates
    - name: "speedyapply-2027-SWE"
      url: "https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md"
      batch_years: [2027, 2028, 2029]
    - name: "speedyapply-2027-AI"
      url: "https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md"
      batch_years: [2027, 2028, 2029]


