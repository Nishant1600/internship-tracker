schedule:
  time: "08:00"
  timezone: "Asia/Kolkata"

database:
  path: "./data/jobs.db"

logging:
  level: "INFO"
  file: "./logs/tracker.log"

scraper:
  timeout_seconds: 15
  retry_count: 3
  retry_backoff_seconds: 5
  headless: true

filters:
  role_keywords:
    include:
      - "intern"
      - "internship"
      - "summer intern"
      - "winter intern"
      - "research intern"
      - "co-op"
      - "new grad"
      - "new graduate"
    exclude:
      - "senior"
      - "lead"
      - "manager"
      - "director"
      - "staff"
      - "principal"
      - "full-time only"
  title_keywords:
    include:
      - "software engineer"
      - "SWE"
      - "software development"
      - "quantitative"
      - "quant"
      - "data science"
      - "machine learning"
      - "ML"
      - "research"
      - "risk analyst"
      - "backend"
      - "frontend"
      - "full stack"
    exclude: []
  locations:
    include:
      - "india"
      - "bangalore"
      - "hyderabad"
      - "pune"
      - "delhi"
      - "mumbai"
      - "gurugram"
      - "gurgaon"
      - "noida"
      - "chennai"
      - "remote"
    exclude:
      - "us only"
      - "eu only"
      - "uk only"
  employment_types:
    include:
      - "intern"
      - "internship"
      - "contract"
    exclude:
      - "full-time"
  allowed_grad_years:
    - 2027
    - 2028
    - 2029
    - null
  max_posting_age_days: 30
  minimum_match_score: 0

hiring_agent:
  enabled: true
  repo_path: "../hiring-agent-main"
  python_path: "../hiring-agent-main/.venv/bin/python"
  resume_path: "./data/resume.pdf"
  rerun_on_resume_change: false
  cache_dir: "./data/hiring_agent_cache"
  llm_backend: "ollama"
  ollama_base_url: "http://localhost:11434"

telegram:
  enabled: true
  max_jobs_per_digest: 25
  send_if_empty: false

features:
  hiring_agent_scoring: true
  dedup_notifications: true
  track_seen_only: false

aggregator_feeds:
  enabled: true
  max_posting_age_days: 3
  sources:
    - name: "speedyapply-2026-SWE"
      url: "https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/README.md"
      batch_years: [2026, 2027]
    - name: "speedyapply-2027-SWE"
      url: "https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md"
      batch_years: [2027, 2028, 2029]
    - name: "speedyapply-2026-AI"
      url: "https://raw.githubusercontent.com/speedyapply/2026-AI-College-Jobs/main/README.md"
      batch_years: [2026, 2027]
    - name: "speedyapply-2027-AI"
      url: "https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md"
      batch_years: [2027, 2028, 2029]

